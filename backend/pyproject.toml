[project]
name = "truck-routing-backend"
version = "0.1.0"
description = "Weather-aware truck routing API (Django + DRF)"
authors = [
    { name = "Daniel Macias", email = "danielmaciasbossio@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "redis>=5",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
